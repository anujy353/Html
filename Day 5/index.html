<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms and input tags </title>
</head>

<body>
    <!--Learning Form tag-->
    <form action="dumy.html">

        <!--submit-> post -> data -> Database-->
        <div>
            <label for="Name">Name</label>
            <input type="text" placeholder="Enter your name" id="Name" required>

        </div><br>



        <div>
            <label for="pass">Password</label>
            <input type="password" placeholder="Enter Your Password" id="pass" minlength="6" maxlength="10" required>
        </div><br>



        <div>
            <label for="mail">Email</label>
            <input type="email" placeholder="Email adress" id="mail" required>
        </div><br>


        <div>
            <label for="date">Date Of Birth</label>
            <input type="date" id="date">
        </div><br>


        <div>
            <label for="age">Age</label>
            <input type="number" placeholder="Enter your age " id="age">
        </div><br>


        <div>
            <label for="gender">Gender</label>
            <input type="radio" name="Gender" value="male" id="gender"> Male
            <input type="radio" name="Gender" value="Female" id="gender"> Female
            <input type="radio" name="Gender" value="other" id="gender"> Others


        </div><br>



        <div>
            <label for="Tc">Terms & Condition</label>
            <input type="checkbox" id="Tc" aria-checked="true">
        </div><br>




        <div>
            <label for="Rs">Resume</label>
            <input type="file" id="Rs" accept=".pdf">
        </div><br>



        <div>
            <label for="test">Dificulty</label>
            <input type="range" id="test">
        </div><br>



        <div>
            <textarea placeholder="Feedback" cols="30" rows="7"></textarea>

        </div><br>





        <div>
            <label for="">Job</label>
            <select name="Comapnay">
                <option value="microsoft">microsoft</option>
                <option value="Google">google</option>
                <option value="amazone">amazone</option>
            </select>
        </div><br>




        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>


    </form>
</body>

</html>
